version: '3.8'

services:
  api:
    build:
      context: ./docker/api
      dockerfile: Dockerfile
    container_name: planity-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

  mobile:
    build:
      context: ./docker/mobile
      dockerfile: Dockerfile
    container_name: planity-mobile
    restart: unless-stopped
    ports:
      - "19000:19000"
    environment:
      - NODE_ENV=development

  db:
    image: postgres:15-alpine
    container_name: planity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: planity
      POSTGRES_USER: planity_user
      POSTGRES_PASSWORD: planity_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: planity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:{}