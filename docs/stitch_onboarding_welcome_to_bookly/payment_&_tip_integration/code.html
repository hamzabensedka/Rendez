<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#606c38",
                        "primary-dark": "#4a542b",
                        "background-light": "#fefae0",
                        "background-dark": "#1b1c16",
                        "secondary": "#dda15e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom Radio Styles */
        .custom-radio:checked + div {
            border-color: #606c38;
            background-color: rgba(96, 108, 56, 0.05);
        }
        
        /* Hide scrollbar for clean horizontal scroll if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#151613] dark:text-[#e2e3de] antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 flex items-center bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 pb-2 justify-between border-b border-black/5 dark:border-white/5">
<div class="flex size-12 shrink-0 items-center justify-start cursor-pointer hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Payment</h2>
</div>
<!-- Scrollable Content -->
<div class="flex-1 flex flex-col px-4 pb-32 pt-2">
<!-- Payment Method Section -->
<div class="mt-4">
<h3 class="tracking-tight text-xl font-bold leading-tight text-left pb-4">Select Payment</h3>
<div class="flex flex-col gap-3">
<!-- Saved Card -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only custom-radio" name="payment_method" type="radio"/>
<div class="flex items-center gap-4 rounded-2xl border border-solid border-[#e2e3de] dark:border-[#3a3b36] bg-white dark:bg-[#252620] p-4 transition-all hover:border-primary/50">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-background-light dark:bg-[#30312a] text-primary">
<span class="material-symbols-outlined">credit_card</span>
</div>
<div class="flex grow flex-col">
<p class="text-sm font-semibold leading-normal">Saved Card</p>
<p class="text-xs text-gray-500 dark:text-gray-400">**** 1234</p>
</div>
<div class="size-5 rounded-full border-2 border-[#e2e3de] peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center">
<div class="size-2 rounded-full bg-white opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
</label>
<!-- Apple Pay -->
<label class="relative cursor-pointer group">
<input class="peer sr-only custom-radio" name="payment_method" type="radio"/>
<div class="flex items-center gap-4 rounded-2xl border border-solid border-[#e2e3de] dark:border-[#3a3b36] bg-white dark:bg-[#252620] p-4 transition-all hover:border-primary/50">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-background-light dark:bg-[#30312a] text-primary">
<span class="material-symbols-outlined">phone_iphone</span>
</div>
<div class="flex grow flex-col">
<p class="text-sm font-semibold leading-normal">Apple Pay</p>
</div>
<div class="size-5 rounded-full border-2 border-[#e2e3de] peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center">
<div class="size-2 rounded-full bg-white opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
</label>
<!-- Gift Card -->
<label class="relative cursor-pointer group">
<input class="peer sr-only custom-radio" name="payment_method" type="radio"/>
<div class="flex items-center gap-4 rounded-2xl border border-solid border-[#e2e3de] dark:border-[#3a3b36] bg-white dark:bg-[#252620] p-4 transition-all hover:border-primary/50">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-background-light dark:bg-[#30312a] text-primary">
<span class="material-symbols-outlined">card_giftcard</span>
</div>
<div class="flex grow flex-col">
<p class="text-sm font-semibold leading-normal">Gift Card</p>
</div>
<div class="size-5 rounded-full border-2 border-[#e2e3de] peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center">
<div class="size-2 rounded-full bg-white opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
</label>
</div>
</div>
<!-- Add a Tip Section -->
<div class="mt-8">
<div class="flex items-center justify-between pb-4">
<h3 class="tracking-tight text-xl font-bold leading-tight">Add a Tip</h3>
<span class="text-xs font-medium text-gray-500 bg-white/50 dark:bg-white/10 px-2 py-1 rounded-md">100% goes to staff</span>
</div>
<div class="flex gap-3 flex-wrap">
<!-- 10% Chip -->
<label class="cursor-pointer">
<input class="peer sr-only" name="tip" type="radio" value="10"/>
<div class="flex h-10 min-w-[4rem] items-center justify-center rounded-xl border border-secondary bg-white dark:bg-[#252620] text-secondary font-medium transition-all peer-checked:bg-secondary peer-checked:text-white hover:bg-secondary/10">
                            10%
                        </div>
</label>
<!-- 15% Chip (Default) -->
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="tip" type="radio" value="15"/>
<div class="flex h-10 min-w-[4rem] items-center justify-center rounded-xl border border-secondary bg-white dark:bg-[#252620] text-secondary font-medium transition-all peer-checked:bg-secondary peer-checked:text-white hover:bg-secondary/10">
                            15%
                        </div>
</label>
<!-- 20% Chip -->
<label class="cursor-pointer">
<input class="peer sr-only" name="tip" type="radio" value="20"/>
<div class="flex h-10 min-w-[4rem] items-center justify-center rounded-xl border border-secondary bg-white dark:bg-[#252620] text-secondary font-medium transition-all peer-checked:bg-secondary peer-checked:text-white hover:bg-secondary/10">
                            20%
                        </div>
</label>
<!-- Custom Tip Chip -->
<label class="cursor-pointer">
<input class="peer sr-only" name="tip" type="radio" value="custom"/>
<div class="flex h-10 px-4 items-center justify-center rounded-xl border border-gray-300 dark:border-gray-600 bg-transparent text-gray-500 font-medium transition-all peer-checked:border-secondary peer-checked:text-secondary hover:border-secondary/50">
                            Custom
                        </div>
</label>
</div>
</div>
<!-- Cost Summary -->
<div class="mt-8 pt-6 border-t border-black/10 dark:border-white/10">
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center text-sm text-gray-600 dark:text-gray-400">
<span>Appointment</span>
<span>$85.00</span>
</div>
<div class="flex justify-between items-center text-sm text-gray-600 dark:text-gray-400">
<span>Tax</span>
<span>$4.25</span>
</div>
<div class="flex justify-between items-center text-sm text-secondary font-medium">
<span>Tip (15%)</span>
<span>$12.75</span>
</div>
<div class="my-2 h-px bg-black/10 dark:bg-white/10"></div>
<div class="flex justify-between items-center text-xl font-bold text-[#151613] dark:text-white">
<span>Total</span>
<span>$102.00</span>
</div>
</div>
</div>
</div>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-black/5 dark:border-white/5">
<button class="w-full h-14 bg-primary hover:bg-primary-dark text-white rounded-2xl font-bold text-lg shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Pay $102.00</span>
<span class="material-symbols-outlined text-sm pt-0.5">arrow_forward</span>
</button>
</div>
</div>
</body></html>
