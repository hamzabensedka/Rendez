<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bookly - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#606c38", /* Adjusted primary based on user request */
              "primary-dark": "#283618", /* Darker earthy tone */
              "background-light": "#fefae0", /* User requested specific background */
              "background-dark": "#1d2111",
              "earth-border": "#606c38",
              "earth-text": "#283618",
              "earth-muted": "#dda15e",
              "earth-light": "#bc6c25",
            },
            fontFamily: {
              "display": ["Work Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Work Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
<div class="relative flex h-full min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden max-w-md mx-auto shadow-sm">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<button class="text-earth-text dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h2 class="text-earth-text dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Sign Up</h2>
</div>
<!-- Content Container -->
<div class="flex-1 flex flex-col px-4">
<!-- Headline -->
<h1 class="text-earth-text dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-2 pt-6">Create Account</h1>
<p class="text-earth-text/70 dark:text-white/70 text-center text-sm mb-8">Join Bookly to manage your appointments seamlessly</p>
<!-- Form Fields -->
<div class="flex flex-col gap-5">
<!-- Name Field -->
<label class="flex flex-col w-full">
<p class="text-earth-text dark:text-white text-base font-medium leading-normal pb-2">Full Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-earth-text dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-earth-border/40 bg-white/50 dark:bg-white/5 focus:border-earth-border h-14 placeholder:text-earth-text/40 dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal transition-all" placeholder="Enter your full name" type="text"/>
</label>
<!-- Email Field -->
<label class="flex flex-col w-full">
<p class="text-earth-text dark:text-white text-base font-medium leading-normal pb-2">Email</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-earth-text dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-earth-border/40 bg-white/50 dark:bg-white/5 focus:border-earth-border h-14 placeholder:text-earth-text/40 dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal transition-all" placeholder="Enter your email address" type="email"/>
</label>
<!-- Password Field -->
<label class="flex flex-col w-full">
<p class="text-earth-text dark:text-white text-base font-medium leading-normal pb-2">Password</p>
<div class="relative flex w-full items-center">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-earth-text dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-earth-border/40 bg-white/50 dark:bg-white/5 focus:border-earth-border h-14 placeholder:text-earth-text/40 dark:placeholder:text-white/40 p-[15px] pr-12 text-base font-normal leading-normal transition-all" placeholder="Create a password" type="password"/>
<button class="absolute right-0 top-0 bottom-0 px-4 text-earth-text/60 dark:text-white/60 flex items-center justify-center hover:text-earth-text dark:hover:text-white transition-colors">
<span class="material-symbols-outlined text-[24px]">visibility_off</span>
</button>
</div>
</label>
<!-- Terms Checkbox (Optional but good UX for signups) -->
<div class="flex items-start gap-3 mt-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 border border-earth-border/40 rounded bg-white/50 focus:ring-2 focus:ring-primary text-primary cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="text-sm text-earth-text/80 dark:text-white/80" for="terms">
                        I agree to the <a class="font-semibold text-primary-dark dark:text-primary underline decoration-primary/30" href="#">Terms of Service</a> and <a class="font-semibold text-primary-dark dark:text-primary underline decoration-primary/30" href="#">Privacy Policy</a>
</label>
</div>
</div>
<!-- Main CTA -->
<div class="mt-8">
<button class="w-full bg-primary hover:bg-primary-dark text-white font-bold text-lg h-14 rounded-xl shadow-lg shadow-primary/20 transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center">
                    Create Account
                </button>
</div>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-earth-border/20"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="bg-background-light dark:bg-background-dark px-4 text-earth-text/60 dark:text-white/60">Or sign up with</span>
</div>
</div>
<!-- Social Login Buttons -->
<div class="grid grid-cols-3 gap-4 mb-8">
<button class="flex items-center justify-center h-14 bg-white/60 dark:bg-white/5 border border-earth-border/20 rounded-xl hover:bg-white hover:shadow-md transition-all duration-200 group">
<!-- Google Icon -->
<svg class="w-6 h-6" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="flex items-center justify-center h-14 bg-white/60 dark:bg-white/5 border border-earth-border/20 rounded-xl hover:bg-white hover:shadow-md transition-all duration-200">
<!-- Apple Icon -->
<svg class="w-6 h-6 text-earth-text dark:text-white" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.47-1.09-.42-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.47C2.7 15.25 3.66 7.79 8.65 7.55c1.3.06 2.27.79 3 .79.7 0 1.94-.95 3.4-.8 3.52.37 4.96 2.76 5.03 2.84-.04.03-3.04 1.76-3.04 5.25 0 3.6 3.2 4.9 3.25 4.94-.03.09-.46 1.58-1.54 3.16-.7.98-1.39 1.95-2.43 1.95zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.17 2.3-2.13 4.2-3.74 4.25z"></path>
</svg>
</button>
<button class="flex items-center justify-center h-14 bg-white/60 dark:bg-white/5 border border-earth-border/20 rounded-xl hover:bg-white hover:shadow-md transition-all duration-200 text-[#1877F2]">
<!-- Facebook Icon -->
<svg class="w-7 h-7" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"></path>
</svg>
</button>
</div>
<!-- Login Link -->
<div class="mt-auto mb-8 text-center">
<p class="text-earth-text dark:text-white">
                    Already have an account? 
                    <a class="font-bold text-primary-dark dark:text-primary hover:underline decoration-2 underline-offset-2" href="#">Log in</a>
</p>
</div>
</div>
</div>
</body></html>
