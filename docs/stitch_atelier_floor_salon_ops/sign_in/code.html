<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Atelier - Sign In</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-tertiary-container": "#858384",
                        "on-error-container": "#93000a",
                        "block-past": "#E7E2D8",
                        "surface-variant": "#e6e2e0",
                        "outline": "#7d766f",
                        "inverse-primary": "#cbc5c2",
                        "primary-fixed": "#e8e1dd",
                        "tertiary": "#000000",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#1b1b1c",
                        "primary": "#000000",
                        "primary-container": "#1d1b19",
                        "secondary-fixed-dim": "#ffb4a8",
                        "on-surface-variant": "#4c4640",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#e5e2e3",
                        "tertiary-fixed-dim": "#c8c6c7",
                        "on-tertiary-fixed-variant": "#474647",
                        "on-primary-fixed": "#1d1b19",

                        "on-primary-container": "#878380",
                        "on-error": "#ffffff",
                        "secondary": "#b62419",
                        "on-tertiary-fixed": "#1b1b1c",
                        "on-secondary": "#ffffff",
                        "paper-bg": "#F3F0E8",
                        "on-secondary-fixed": "#410000",
                        "inverse-surface": "#313030",
                        "hairline": "#D9D4CC",
                        "secondary-container": "#fd5845",
                        "surface-container-high": "#ebe7e6",
                        "on-background": "#1c1b1b",
                        "outline-variant": "#cec5bd",
                        "secondary-fixed": "#ffdad5",
                        "inverse-on-surface": "#f4f0ef",
                        "primary-fixed-dim": "#cbc5c2",
                        "surface-bright": "#fdf8f7",
                        "on-primary-fixed-variant": "#494644",
                        "surface-container-highest": "#e6e2e0",
                        "on-surface": "#1c1b1b",
                        "on-secondary-fixed-variant": "#930303",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#5c0000",
                        "surface-tint": "#615e5b",
                        "success-muted": "#3F6B4A",
                        "paper-raised": "#FAF8F3",
                        
                        "ink-solid": "#161412" // Custom exact match for strict constraint
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem",
                        "btn-radius": "4px" // Exact match
                    },
                    "spacing": {
                        "margin-edge": "1.25rem", // slightly wider for mobile density
                        "row-height-time": "3rem",
                        "hairline-width": "1px",
                        "gutter-column": "0.75rem",
                        "btn-height": "52px" // Exact match
                    },
                    "fontFamily": {

                }
            }
        }

<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        /* Custom underline input reset */
        input.blank-input {
            border: none;
            border-bottom: 1px solid #D9D4CC;
            background: transparent;
            padding-left: 0;
            padding-right: 0;
            border-radius: 0;
            box-shadow: none !important;
        }
        
        input.blank-input:focus {
            border-bottom-color: #161412;
            outline: none;
            box-shadow: none !important;
            border-bottom-width: 2px;
        }

        input.blank-input::placeholder {
            color: #6B6560; /* ink-muted equivalent */
            font-weight: 400;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-paper-bg text-primary h-full w-full flex justify-center overflow-x-hidden antialiased">
<!-- Mobile Container (Max 390px as requested) -->
<main class="w-full max-w-[390px] h-full min-h-[844px] flex flex-col px-margin-edge relative bg-paper-bg shadow-[0_0_40px_rgba(0,0,0,0.03)] sm:my-8 sm:h-auto sm:min-h-0 sm:border border-hairline">
<!-- Header / Top Bar -->
<header class="w-full flex items-center justify-between py-6">
<span class="font-headline-md text-headline-md tracking-tighter text-primary uppercase">Atelier</span>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary cursor-pointer hover:opacity-70 transition-opacity" style="font-variation-settings: 'FILL' 0;">close</span>
</div>
</header>
<!-- Main Content Area -->
<div class="flex-grow flex flex-col justify-start mt-8 pb-12">
<!-- Headline -->
<h1 class="font-display-date text-display-date text-primary mb-12 w-[80%] leading-tight text-left">
                Welcome<br/>back
            </h1>
<!-- Role Toggle (Hairline Pills) -->
<div class="flex items-center space-x-2 mb-10 w-full">
<!-- Active Pill (Solid) -->
<button class="px-5 py-2 rounded-full bg-ink-solid text-paper-raised font-body-sm text-body-sm font-medium transition-colors border border-ink-solid cursor-default">
                    Client
                </button>
<!-- Inactive Pill (Hairline) -->
<button class="px-5 py-2 rounded-full bg-transparent text-ink-muted font-body-sm text-body-sm font-medium transition-colors hover:text-primary hover:border-primary border border-hairline">
                    Professional
                </button>
</div>
<!-- Form Inputs -->
<form class="flex flex-col space-y-8 w-full" onsubmit="event.preventDefault();">
<div class="w-full">
<input autocomplete="email" class="blank-input w-full pb-3 font-body-lg text-body-lg text-primary" id="email" placeholder="Email" required="" type="email"/>
</div>
<div class="w-full relative">
<input autocomplete="current-password" class="blank-input w-full pb-3 font-body-lg text-body-lg text-primary pr-10" id="password" placeholder="Password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-1 text-ink-muted hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- Spacer -->
<div class="h-2"></div>
<!-- Primary Action Button -->
<button class="w-full h-btn-height rounded-btn-radius bg-ink-solid text-paper-raised font-body-lg text-body-lg font-medium tracking-wide transition-opacity hover:opacity-90 active:scale-[0.98]" type="submit">
                    Sign in
                </button>
</form>
<!-- Links footer -->
<div class="mt-8 flex flex-col space-y-4 text-left w-full">
<a class="font-body-sm text-body-sm text-ink-muted hover:text-primary transition-colors inline-block w-fit underline decoration-hairline underline-offset-4" href="#">
                    Continue without account
                </a>
<a class="font-body-sm text-body-sm text-ink-muted hover:text-primary transition-colors inline-block w-fit underline decoration-hairline underline-offset-4" href="#">
                    Create account
                </a>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for password toggle
        document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function() {
            const pwdInput = document.getElementById('password');
            const icon = this.querySelector('span');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });
    </script>
</body></html>
