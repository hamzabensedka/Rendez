<body class="bg-paper-bg h-full flex flex-col font-body-lg text-ink antialiased">
<!-- No Navigation per request -->
<main class="flex-1 px-margin-edge py-12 flex flex-col justify-center max-w-md mx-auto w-full">
<header class="mb-12">
<h1 class="font-display-date text-display-date text-ink tracking-tight mb-2">Create account</h1>
<p class="font-body-lg text-body-lg text-ink-muted">Join Atelier Floor</p>
</header>
<form action="#" class="flex flex-col gap-8 w-full" method="POST">
<div class="relative">
<label class="block font-ui-label text-ui-label text-ink-muted mb-2 uppercase" for="name">Full Name</label>
<input class="block w-full border-0 border-b border-hairline bg-transparent p-0 pb-2 focus:ring-0 focus:border-ink font-body-lg text-body-lg text-ink placeholder-transparent transition-colors" id="name" name="name" placeholder="Full Name" required="" type="text"/>
</div>
<div class="relative">
<label class="block font-ui-label text-ui-label text-ink-muted mb-2 uppercase" for="email">Email Address</label>
<input class="block w-full border-0 border-b border-hairline bg-transparent p-0 pb-2 focus:ring-0 focus:border-ink font-body-lg text-body-lg text-ink placeholder-transparent transition-colors" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
<div class="relative">
<label class="block font-ui-label text-ui-label text-ink-muted mb-2 uppercase" for="password">Password</label>
<input class="block w-full border-0 border-b border-hairline bg-transparent p-0 pb-2 focus:ring-0 focus:border-ink font-body-lg text-body-lg text-ink placeholder-transparent transition-colors" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<button class="w-full bg-ink text-paper-bg py-4 mt-4 rounded-lg font-headline-md text-body-lg font-semibold tracking-wide hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
                Create account
            </button>
</form>
<div class="mt-8 text-center">
<a class="font-body-sm text-body-sm text-ink-muted hover:text-ink transition-colors" href="#">
                Already have an account? Sign in
            </a>
</div>
</main>
</body></html>
